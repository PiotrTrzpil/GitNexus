[package]
name = "oxc-cfg-napi"
version = "0.1.0"
edition = "2021"
description = "NAPI binding for oxc control flow graph analysis — GitNexus"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
# oxc crates — pinned to 0.120.0 for API stability
oxc_allocator = "0.120.0"
oxc_ast = "0.120.0"
oxc_cfg = "0.120.0"
oxc_parser = "0.120.0"
oxc_semantic = { version = "0.120.0", features = ["cfg"] }
oxc_span = "0.120.0"

# NAPI bindings
napi = { version = "3", features = ["napi4"] }
napi-derive = "3"

# Graph traversal for per-function subgraph splitting.
# Must match the version oxc_cfg uses internally.
petgraph = "0.8"

[build-dependencies]
napi-build = "2"

[profile.release]
# Reduce binary size while keeping reasonable performance
opt-level = "z"
lto = true
strip = true
